# Render manifest for deploying this Laravel app with Docker
# - Adapt the 'name', 'branch' and 'region' fields to your setup before applying.
# - Do NOT put secrets in this file; set them in the Render dashboard or using the CLI.

services:
  - type: web
    name: laravel-bank-app
    env: docker
    branch: production
    plan: starter
    region: oregon
    diskGb: 1
    dockerfilePath: Dockerfile
    buildCommand: null
    startCommand: null
    envVars:
      # Runtime configuration (fill via Render dashboard or CLI)
      - key: PORT
        value: "10000"
      - key: APP_ENV
        value: "production"
      - key: APP_DEBUG
        value: "false"
      - key: RUN_SEEDERS
        value: "false"
      - key: MIGRATE_ON_STARTUP
        value: "false"
      - key: MAX_RETRIES
        value: "10"

# Optional managed Postgres that Render can provision. If you create it via Render,
# fill the DB_* envVars above in the dashboard (do not store passwords here).
databases:
  - name: laravel-db
    type: postgresql
    plan: starter

# Recommended environment variables to set in the Render dashboard (examples of keys):
# APP_KEY, DB_CONNECTION, DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD,
# CACHE_DRIVER, SESSION_DRIVER, QUEUE_CONNECTION, MAIL_*

# Notes:
# - After pushing this manifest, go to Render dashboard to set secrets like APP_KEY,
#   DB_USERNAME, DB_PASSWORD, etc. The managed DB's connection details will be shown in the UI.
