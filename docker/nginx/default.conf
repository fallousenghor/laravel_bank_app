server {
    listen 80;
    server_name fallou.senghor.bank.com;
    root /var/www/html/public;
    index index.php;

    # Better error handling
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    location / {
        # Serve static files directly when present, otherwise proxy to the
        # Laravel development server running inside the `app` container on port 8000.
        try_files $uri $uri/ @laravel;
    }

    location @laravel {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Note: this setup proxies requests to the PHP built-in server started by
    # `php artisan serve` inside the `app` container. If you switch to php-fpm
    # (recommended for production), revert to fastcgi_pass app:9000 and run
    # php-fpm in the `app` container.
}
